<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1f1a"/>
      <stop offset="100%" stop-color="#111c18"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Chart line decoration -->
  <polyline points="60,500 160,460 260,440 360,400 460,360 560,300 660,270 760,230 860,190 960,160 1060,130 1160,100"
    stroke="#3d9e72" stroke-width="2.5" fill="none" opacity="0.6"/>
  <polyline points="60,540 160,520 260,510 360,490 460,460 560,420 660,400 760,370 860,340 960,310 1060,290 1160,260"
    stroke="#3d9e72" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="6 4"/>
  <!-- Green accent bar -->
  <rect x="80" y="175" width="4" height="60" fill="#3d9e72" rx="2"/>
  <!-- Main headline -->
  <text x="104" y="220" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="300" fill="white" letter-spacing="-1">AI Equity Reports</text>
  <!-- Subline -->
  <text x="104" y="278" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="300" fill="rgba(255,255,255,0.5)">Value pool analysis · Reverse valuation · Full financials</text>
  <!-- Brand -->
  <text x="104" y="540" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#3d9e72" letter-spacing="0.05em">VALUATUM</text>
  <text x="230" y="540" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.3)">· aiequityreports.com</text>
  <!-- Stats row -->
  <rect x="104" y="350" width="200" height="80" rx="8" fill="rgba(61,158,114,0.08)" stroke="rgba(61,158,114,0.2)" stroke-width="1"/>
  <text x="204" y="382" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="300" fill="white">€4.90</text>
  <text x="204" y="410" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">from per report</text>
  <rect x="324" y="350" width="200" height="80" rx="8" fill="rgba(61,158,114,0.08)" stroke="rgba(61,158,114,0.2)" stroke-width="1"/>
  <text x="424" y="382" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="300" fill="white">Free</text>
  <text x="424" y="410" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">samples available</text>
  <rect x="544" y="350" width="200" height="80" rx="8" fill="rgba(61,158,114,0.08)" stroke="rgba(61,158,114,0.2)" stroke-width="1"/>
  <text x="644" y="382" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="300" fill="white">25+</text>
  <text x="644" y="410" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">years expertise</text>
</svg>

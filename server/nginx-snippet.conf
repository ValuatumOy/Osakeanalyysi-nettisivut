# ──────────────────────────────────────────────────────────────────────────────
# Add these two location blocks inside the existing server{} block in:
#   /etc/nginx/sites-available/default
#
# The Express app runs on port 3001 (managed by PM2).
# ──────────────────────────────────────────────────────────────────────────────

    # Proxy API requests to the Node.js app
    location /api/ {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Serve report PDFs publicly
    location /reports/ {
        alias /var/www/html/reports/;
        add_header Content-Disposition 'inline';
        add_header X-Content-Type-Options nosniff;
    }

name: Company pages sync

# Keeps the financial figures on company overview pages equal to Valuatum's Wisdom model, the
# same data a generated report uses (scripts/sync-company-pages.mjs). Weekly; a run where no
# model changed writes nothing. Pages it cannot update safely are skipped and listed in the job
# summary. Differences between Wisdom and issuers' filings are fixed in Wisdom, not on the pages.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Same group as report-pages-sync, so the two never push to main at the same time.
concurrency:
  group: report-pages-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-page-freshness reads each file's last commit date.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Update figures from Wisdom
        env:
          WISDOM_API_TOKEN: ${{ secrets.WISDOM_API_TOKEN }}
        run: |
          status=0
          node scripts/sync-company-pages.mjs --write > /tmp/sync.txt 2>&1 || status=$?
          cat /tmp/sync.txt
          {
            echo '### Company pages sync'
            echo '```'
            tail -1 /tmp/sync.txt
            echo '```'
            echo '<details><summary>Updated, skipped and failed pages</summary>'
            echo
            echo '```'
            cat /tmp/sync.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Regenerate the SEO derivatives of the updated pages
        run: |
          node scripts/retitle-report-pages.mjs
          node scripts/redescribe-report-pages.mjs
          node scripts/update-company-breadcrumbs.mjs
          node scripts/build-company-index.mjs
          node scripts/build-llms-txt.mjs
          node scripts/build-page-freshness.mjs
          node scripts/add-analyst-section.mjs

      - name: Guard
        run: |
          node --test test/company-pages/*.test.mjs
          node scripts/validate-jsonld.mjs

      - name: Commit and push
        run: |
          git add reports sitemap.xml llms.txt companies companies.html
          if git diff --cached --quiet; then
            echo "No changes: every page already shows the model figures."
            exit 0
          fi
          git config user.name "company-pages-sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Company pages: sync figures with the Wisdom model"
          git push

name: Blog pipeline

# Schedule: 21:30 Europe/Helsinki
#   Summer (EEST, UTC+3) = 18:30 UTC  ← current setting
#   Winter (EET,  UTC+2) = 19:30 UTC  ← update cron times in December
on:
  schedule:
    - cron: '30 18 * * 1,3,5'   # Mon/Wed/Fri — full pipeline
    - cron: '30 18 * * 0'       # Sunday — topic-proposal run
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - topic-proposal

permissions:
  contents: write
  pull-requests: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.name "Blog Pipeline"
          git config user.email "blog@valuatum.com"

      - name: Determine run mode
        id: mode
        run: |
          INPUT="${{ github.event.inputs.mode }}"
          if [ -n "$INPUT" ]; then
            echo "mode=$INPUT" >> $GITHUB_OUTPUT
          else
            DAY=$(TZ=Europe/Helsinki date +%u)   # 1=Mon … 7=Sun
            [ "$DAY" = "7" ] && echo "mode=topic-proposal" >> $GITHUB_OUTPUT \
                             || echo "mode=full" >> $GITHUB_OUTPUT
          fi

      - name: Write pipeline prompt
        env:
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          cat > /tmp/prompt.txt << 'HEADER'
          You are the Valuatum blog pipeline agent running in GitHub Actions CI.

          ENVIRONMENT:
          - Repository: ValuatumOy/Osakeanalyysi-nettisivut (already checked out)
          - All repo files are in the current working directory
          - git is configured: user "Blog Pipeline" <blog@valuatum.com>
          - gh CLI is authenticated via GH_TOKEN env var
          - node v20 is available; run 'node scripts/build-blog-pages.mjs' (no npm install needed)
          - Internet access is available for WebSearch and WebFetch

          AUTHORIZATION:
          You are fully authorized to take all actions in this repo. No human confirmation is
          needed or available — this is a non-interactive CI run. Make all decisions autonomously
          per the rules in PIPELINE.md.

          GIT WORKFLOW:
          1. Stay on main for all reads.
          2. Create article branch: git checkout -b blog/{slug}
          3. Write/edit files, then: node scripts/build-blog-pages.mjs
          4. Stage and commit: git add blog-content/{slug}.json blog/{slug}.html blog.html scripts/sitemap-blog.xml && git commit -m "Blog: {title}"
          5. Push: git push -u origin blog/{slug}
          6. Open PR: gh pr create --base main --title "Blog: {title}" --body "..."
          7. Switch back to main: git checkout main

          HEADER

          echo "RUN_MODE: $RUN_MODE" >> /tmp/prompt.txt
          echo "Current Helsinki time: $(TZ=Europe/Helsinki date '+%Y-%m-%d %H:%M %Z')" >> /tmp/prompt.txt
          echo "" >> /tmp/prompt.txt
          echo "--- PIPELINE RUNBOOK (follow exactly) ---" >> /tmp/prompt.txt
          cat blog-system/PIPELINE.md >> /tmp/prompt.txt

      - name: Run blog pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          claude --dangerouslySkipPermissions --model claude-opus-5 \
            -p "$(cat /tmp/prompt.txt)"

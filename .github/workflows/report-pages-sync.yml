name: Report pages sync

# Keeps every catalog-derived page in step with the live catalog (docs/report-page-automation.md):
# extracts content for newly published reports, rebuilds the landing pages, the reports.html
# card grid and the sitemap, verifies the result, and commits straight to main (Vercel deploys
# on push). Hourly, because three catalog changes are time-driven and fire no event; a no-change
# run writes nothing and costs seconds. workflow_dispatch is the manual "sync now" button.
#
# The guard runs BEFORE the commit, so an inconsistent state never reaches main — a failing run
# is a red workflow and no commit, and the site freezes at its last consistent state. A rejected
# push (someone pushed during the run) also just fails red; the next hourly run catches up.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report-pages-sync
  cancel-in-progress: false

jobs:
  sync:
    # Production pages are committed to main only. A manual run from staging (to try sync-test
    # before it reaches main) must not bake production pages into staging.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-page-freshness reads each file's last commit date.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Sync pages from the live catalog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/report-pages/sync.mjs --failures-out /tmp/extraction-failures

      - name: Guard — built state must agree with the live catalog
        run: node scripts/report-pages/check.mjs --allow-missing-file /tmp/extraction-failures

      # The SEO guard (seo-guard.yml) checks these derivatives on every PR but
      # never ran here, so each sync that rebuilt a page left the next PR red
      # until someone regenerated them by hand. Same commands, same order, as
      # the guard's own fix instructions. OG cards need Chrome and stay manual.
      - name: Regenerate the SEO derivatives of the rebuilt pages
        run: |
          node scripts/retitle-report-pages.mjs
          node scripts/redescribe-report-pages.mjs
          node scripts/build-company-index.mjs
          node scripts/build-llms-txt.mjs
          node scripts/build-page-freshness.mjs
          node scripts/add-analyst-section.mjs

      - name: Commit and push
        run: |
          git add report-content reports reports.html sitemap.xml llms.txt companies
          if git diff --cached --quiet; then
            echo "No changes — catalog and pages already agree."
            exit 0
          fi
          git config user.name "report-pages-sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Report pages: sync with the live catalog"
          git push

      # After the good work is committed: a failed extraction means a live report has no page
      # content. Nothing else surfaces a silently failing sync, so be loud.
      - name: Fail loudly on extraction failures
        run: |
          if [ -s /tmp/extraction-failures ]; then
            echo "::error::Extraction failed for: $(paste -sd, /tmp/extraction-failures). Their pages were left untouched — see the job summary."
            exit 1
          fi

  # test.aiequityreports.com's report pages, from the test catalog and the test PDFs, baked into
  # test-site/ on staging (the branch the test site deploys). Only test-site/ is written:
  # production's pages, cards and sitemap stay the job above's. A PDF that fails extraction —
  # the engine's stub for a failed run — is remembered in test-site/report-content/_failed.json
  # and not retried, so it warns once instead of failing every hour.
  sync-test:
    runs-on: ubuntu-latest
    concurrency:
      group: report-pages-sync-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Sync test pages from the test catalog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REPORT_PAGES_STAGE: test
        run: node scripts/report-pages/sync.mjs --failures-out /tmp/extraction-failures

      - name: Commit and push to staging
        run: |
          git add test-site
          if git diff --cached --quiet; then
            echo "No changes — the test catalog and test pages already agree."
            exit 0
          fi
          git config user.name "report-pages-sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Test report pages: sync with the test catalog"
          git push origin HEAD:staging

      - name: Warn on extraction failures
        run: |
          if [ -s /tmp/extraction-failures ]; then
            echo "::warning::Test extraction failed for: $(paste -sd, /tmp/extraction-failures). Remembered in test-site/report-content/_failed.json."
          fi

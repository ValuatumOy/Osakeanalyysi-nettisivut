<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report catalog - Valuatum AI Equity Reports</title>
  <meta name="description" content="Browse Valuatum AI equity reports, open full free sample reports, or buy existing reports.">
  <link rel="stylesheet" href="css/style.css">
  <script>
    const params = new URLSearchParams(window.location.search);
    const ticker = params.get('ticker');
    const target = ticker
      ? `reports.html?search=${encodeURIComponent(ticker)}`
      : 'reports.html#free';
    window.location.replace(target);
  </script>
</head>
<body>
  <main class="checkout-page">
    <div class="checkout-card">
      <h1 class="checkout-title">Free reports have moved.</h1>
      <p class="checkout-body">Free sample reports are now full PDF reports in the report catalog. No card or account required.</p>
      <div class="checkout-actions">
        <a href="reports.html#free" class="btn btn-primary" style="justify-content:center;">View free reports</a>
        <a href="reports.html" class="btn btn-outline-dark" style="justify-content:center;">Browse all reports</a>
      </div>
    </div>
  </main>
</body>
</html>
